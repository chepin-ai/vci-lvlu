name: LVLU-RESPONDER-01
# 株四十 闸流分立律: 响应环独立工作流+独立并发组(chain不消拍, cancel-in-progress:false)——塔链自级联之拥不再杀闸
on:
  # EVENT-DRIVEN sweep R7: schedule removed per 零定时律 (PIVOT-01) · was: - cron: '*/21 * * * *'  # 闸件常拍21min(独立于塔*/37, 互质错峰)
  push:
    # 株45v1.2瞬感道(ucif2 SI-AUTOPILOT式采用, root令建立必启用): inbox投件即拍——全域直通瞬感互作
    paths: ['ci/lvlu_responder.py', 'ci/si3/claims.json', '.github/workflows/lvlu-responder.yml', 'inbox/**']
  repository_dispatch:
    types: [lvlu-tower-cascade, lvlu-tower-kick, lvlu-responder-kick, lvlu-wake, fed-beat]
  workflow_dispatch: {}
permissions:
  contents: write  # 株四十附: GITHUB_TOKEN回退可写(闸件推件权保底)
concurrency:
  group: lvlu-responder-chain
  cancel-in-progress: false  # 闸拍排队不互杀(株四十: 殉拍根因=并发组内消拍)
jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 12  # 株卅九双保: 内有时箱律TIMEBOX-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pynacl cryptography pyquafu
      - name: LVLU-RESPONDER-01 v3.8 (keyreq/disc/wake/sla/nudge/exp/pulse/orbit/mirror/inbox)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE_PAT: ${{ secrets.AI_FULL_PAT }}  # FINE_OWN_PAT_LVLU(root铸20260913T1857Z, 三仓域)
          CI_OPS_LINE_KEY: ${{ secrets.CI_OPS_LINE_KEY }}
          LV_VAULT_CMD: ${{ secrets.LV_VAULT_CMD }}
          READ_MESH_PAT: ${{ secrets.FINE_READ_PAT_LVLU || secrets.READ_MESH_PAT }}  # 株卅八v1.1读域律: root铸名FINE_READ_PAT_LVLU(1354Z); 未铸=空串回退零变
        run: python3 ci/lvlu_responder.py
