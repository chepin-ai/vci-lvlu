name: LVLU-TOWER-01
on:
  schedule:
    - cron: '*/37 * * * *'  # 株卅七 KEEPALIVE-02 死人守: 断链>37min自复燃(非主链,仅保险)
  push:
    paths: ['inbox/**', 'ci/lvlu_tower.py']
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [lvlu-tower-cascade, lvlu-tower-kick]
  workflow_dispatch:
    inputs:
      selftest:
        description: 'selftest=1 干跑(不级联)'
        required: false
        default: '0'
concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && 'lvlu-tower-chain' || 'lvlu-tower-edge' }}
  cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}
jobs:
  tower:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
      actions: write   # 自醒链：塔内 dispatch 自唤下一拍
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: beat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE_PAT: ${{ secrets.AI_FULL_PAT }}  # NAME-HYGIENE-97(qfa代改,覆写权归原线): CI_OPS_LINE_KEY=线App PEM(root复位中),PAT面归AI_FULL_PAT
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          CASCADE_PAYLOAD: ${{ github.event.client_payload && toJSON(github.event.client_payload) || '' }}
          CASCADE_SLEEP_S: ${{ inputs.selftest == '1' && '1' || '600' }}
          SELFTEST: ${{ inputs.selftest || '0' }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: python3 ci/lvlu_tower.py

  mesh-wake:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: mesh-wake hub (event-driven notify)
        env:
          MESH_PAT: ${{ secrets.CI_OPS_LINE_KEY }}
        run: |
          [ -n "$MESH_PAT" ] || { echo "no hub key, skip"; exit 0; }
          curl -sS -m 20 -X POST -H "Authorization: token $MESH_PAT" -H "Accept: application/vnd.github+json"             https://api.github.com/repos/chepin-ai/ci-worker-01/dispatches             -d '{"event_type":"federation-event","client_payload":{"src":"lvlu-tower","kind":"mesh-wake","sha":"${{ github.sha }}"}}'             -o /dev/null -w "mesh-wake http=%{http_code}\n" || true

  mutual-excite:
    # MUTUAL-EXCITE-01 · root裁决:自激-互激/与他线互动,不受会话端/SI1静默限
    # 终止性:line-drive仅自仓级联,无跨仓再分发——互激链必收敛
    runs-on: ubuntu-latest
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: 互激·federation-event扇出（他线互动·名值分离）
        env:
          FED_PAT: ${{ secrets.FED_PAT || secrets.AI_FULL_PAT }}
        run: |
          [ -n "$FED_PAT" ] || { echo "no fed key, skip"; exit 0; }
          for repo in vci-usrm vci-ucif2 vci-vinf vci-cfts vci-qgl vci-qtlv vci-qlv vci-lgt vci-aiq; do
            [ "$repo" = "vci-lvlu" ] && continue
            curl -sS -m 20 -X POST -H "Authorization: token $FED_PAT" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/chepin-ai/$repo/dispatches \
              -d '{"event_type":"federation-event","client_payload":{"src":"vci-lvlu","kind":"mutual-excite","sha":"${{ github.sha }}"}}' \
              -o /dev/null -w "mutual-excite $repo http=%{http_code}\n" || true
            sleep 2
          done
